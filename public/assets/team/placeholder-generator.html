<!DOCTYPE html>
<html>

<head>
	<title>Team Member Placeholder Generator</title>
	<style>
		.placeholder {
			width: 300px;
			height: 300px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			font-size: 48px;
			font-weight: bold;
			font-family: Arial, sans-serif;
			margin: 10px;
			text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
		}

		.sarah {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
		}

		.michael {
			background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
		}

		.amina {
			background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
		}

		.james {
			background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
		}

		.grace {
			background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
		}

		.abdul {
			background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
		}

		.container {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			padding: 20px;
		}

		.member {
			text-align: center;
		}

		.name {
			margin-top: 10px;
			font-family: Arial, sans-serif;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<h1>I-Gene Team Member Placeholders</h1>
	<p>Right-click on each image and "Save as" to download as team member photos.</p>

	<div class="container">
		<div class="member">
			<div class="placeholder sarah">SO</div>
			<div class="name">Dr. Sarah Okonkwo</div>
		</div>

		<div class="member">
			<div class="placeholder michael">MA</div>
			<div class="name">Prof. Michael Adebayo</div>
		</div>

		<div class="member">
			<div class="placeholder amina">AH</div>
			<div class="name">Dr. Amina Hassan</div>
		</div>

		<div class="member">
			<div class="placeholder james">JM</div>
			<div class="name">Dr. James Mwangi</div>
		</div>

		<div class="member">
			<div class="placeholder grace">GO</div>
			<div class="name">Ms. Grace Okello</div>
		</div>

		<div class="member">
			<div class="placeholder abdul">AR</div>
			<div class="name">Dr. Abdul Rahman</div>
		</div>
	</div>

	<script>
		// Convert divs to canvas and enable download
		document.querySelectorAll('.placeholder').forEach((div, index) => {
			const canvas = document.createElement('canvas');
			canvas.width = 300;
			canvas.height = 300;
			const ctx = canvas.getContext('2d');

			// Create gradient
			const gradient = ctx.createLinearGradient(0, 0, 300, 300);
			const colors = [
				['#667eea', '#764ba2'], // Sarah
				['#f093fb', '#f5576c'], // Michael  
				['#4facfe', '#00f2fe'], // Amina
				['#43e97b', '#38f9d7'], // James
				['#fa709a', '#fee140'], // Grace
				['#a8edea', '#fed6e3']  // Abdul
			];

			gradient.addColorStop(0, colors[index][0]);
			gradient.addColorStop(1, colors[index][1]);

			// Draw circle
			ctx.beginPath();
			ctx.arc(150, 150, 150, 0, 2 * Math.PI);
			ctx.fillStyle = gradient;
			ctx.fill();

			// Add text
			ctx.fillStyle = 'white';
			ctx.font = 'bold 48px Arial';
			ctx.textAlign = 'center';
			ctx.shadowColor = 'rgba(0,0,0,0.3)';
			ctx.shadowBlur = 4;
			ctx.shadowOffsetX = 2;
			ctx.shadowOffsetY = 2;
			ctx.fillText(div.textContent, 150, 165);

			// Replace div with canvas
			div.parentNode.replaceChild(canvas, div);
		});
	</script>
</body>

</html>
